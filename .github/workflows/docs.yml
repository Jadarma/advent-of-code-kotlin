name: 'Documentation Site'

# Action Dependency Pins:
# actions/checkout                    - 3d3c42e5aac5ba805825da76410c181273ba90b1 - v7.0.1 - https://github.com/actions/checkout/releases
# actions/upload-pages-artifact       - fc324d3547104276b827a68afc52ff2a11cc49c9 - v5.0.0 - https://github.com/actions/upload-pages-artifact/releases
# actions/deploy-pages                - 368f82528645a54fb793d4d04e342629a3f51346 - v5.0.1 - https://github.com/actions/deploy-pages/releases
# JetBrains/writerside-github-action  - 738910d7cf197d67188300d0e0f84b2e708db3cf - v4     - https://github.com/JetBrains/writerside-github-action/releases
# JetBrains/writerside-checker-action - 79ff89902dcd3d5c5a3f26a79bc35830377f38c5 - v1     - https://github.com/JetBrains/writerside-checker-action/releases

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      INSTANCE: 'docs/aockt'
      ARTIFACT: 'webHelpAOCKT2-all.zip'
      WRS_VERSION: '2026.10.0423'
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Build Writerside Docs'
        uses: JetBrains/writerside-github-action@738910d7cf197d67188300d0e0f84b2e708db3cf
        with:
          docker-version: ${{ env.WRS_VERSION }}
          instance: ${{ env.INSTANCE }}
          artifact: ${{ env.ARTIFACT }}
      - name: 'Test Writerside Docs'
        uses: JetBrains/writerside-checker-action@79ff89902dcd3d5c5a3f26a79bc35830377f38c5
        with:
          instance: artifacts/${{ env.INSTANCE }}
      - name: 'Unzip Artifact'
        run: unzip -qq 'artifacts/${{ env.ARTIFACT }}' -d public
      - name: 'Upload Pages Artifact'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./public

  Deploy:
    needs: [ Build ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
