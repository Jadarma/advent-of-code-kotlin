name: 'Publish'

# Action Dependency Pins:
# actions/checkout            - 3d3c42e5aac5ba805825da76410c181273ba90b1 - v7.0.1 - https://github.com/actions/checkout/releases
# actions/setup-java          - 77dd5b2ce225ea11469928ac317850245a74ae78 - v6.2.0 - https://github.com/actions/setup-java/releases
# gradle/actions/setup-gradle - 8da46b539cd8fe6ab27ca75128919a18d757604c - v6.4.1 - https://github.com/gradle/actions/releases

on:
  workflow_dispatch:
    inputs:
      isRelease:
        description: "Production Release"
        type: boolean
        required: false
        default: false

jobs:
  Publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ inputs.isRelease }}
      PUBLISHING_ENABLED: true
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Setup Java'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version: '21'
          distribution: 'adopt'
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic
          cache-read-only: true
      - name: 'Publish'
        run: ./gradlew --no-build-cache clean build publishToMavenCentral
